<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="dashboard">
    <header class="header">
      <div>
        <p id="date"></p>
        <h1 id="greeting">Good Morning!</h1>
        <p id="clock" class="clock">00:00:00</p>
      </div>
      <button id="themeToggle" class="icon-button" type="button" aria-label="Toggle theme">🌙</button>
    </header>

    <section class="grid">
      <article class="card todo-card">
        <div class="card-heading">
          <div>
            <p class="eyebrow">Daily Tasks</p>
            <h2>To-Do List</h2>
          </div>
          <span id="taskCount">0 tasks</span>
        </div>

        <form id="taskForm" class="input-row">
          <input id="taskInput" type="text" placeholder="What do you need to do?" maxlength="100" required>
          <button type="submit">Add</button>
        </form>

        <ul id="taskList" class="task-list"></ul>
      </article>

      <article class="card timer-card">
        <div class="card-heading">
          <div>
            <p class="eyebrow">Stay Focused</p>
            <h2>Focus Timer</h2>
          </div>
        </div>

        <div id="timerDisplay" class="timer">25:00</div>

        <label for="timerMinutes" class="small-label">Minutes</label>
        <div class="input-row">
          <input id="timerMinutes" type="number" min="1" max="120" value="25">
          <button id="setTimer" type="button">Set</button>
        </div>

        <div class="button-row">
          <button id="startTimer" type="button">Start</button>
          <button id="stopTimer" type="button" class="secondary">Stop</button>
          <button id="resetTimer" type="button" class="secondary">Reset</button>
        </div>
      </article>

      <article class="card links-card">
        <div class="card-heading">
          <div>
            <p class="eyebrow">Shortcuts</p>
            <h2>Quick Links</h2>
          </div>
        </div>

        <form id="linkForm" class="link-form">
          <input id="linkName" type="text" placeholder="Link name" maxlength="30" required>
          <input id="linkUrl" type="url" placeholder="https://example.com" required>
          <button type="submit">Add Link</button>
        </form>

        <div id="quickLinks" class="quick-links"></div>
      </article>

      <article class="card name-card">
        <div>
          <p class="eyebrow">Personalize</p>
          <h2>Your name</h2>
        </div>
        <form id="nameForm" class="input-row">
          <input id="nameInput" type="text" placeholder="Enter your name" maxlength="30">
          <button type="submit">Save</button>
        </form>
      </article>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
